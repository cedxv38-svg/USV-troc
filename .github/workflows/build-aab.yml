name: Build USV Troc Android AAB

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'USV-Troc-1.0.17-source-corrected.zip'
      - '.github/workflows/build-aab.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        shell: bash
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q USV-Troc-1.0.17-source-corrected.zip -d android-project
          PROJECT_DIR="$(find android-project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project dir: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 2 -type f | sort

      - name: Restore upload keystore
        shell: bash
        env:
          USV_KEYSTORE_B64: ${{ secrets.USV_KEYSTORE_B64 }}
        run: |
          test -n "$USV_KEYSTORE_B64"
          printf '%s' "$USV_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > "$GITHUB_WORKSPACE/usv-troc-upload.jks"
          test -s "$GITHUB_WORKSPACE/usv-troc-upload.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/usv-troc-upload.jks" -storepass "${{ secrets.USV_STORE_PASSWORD }}" -alias "${{ secrets.USV_KEY_ALIAS }}"

      - name: Fix release signing configuration
        shell: bash
        run: |
          cat > "$PROJECT_DIR/app/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'fr.usv.troc'
              compileSdk 36

              defaultConfig {
                  applicationId 'fr.usv.troc'
                  minSdk 24
                  targetSdk 36
                  versionCode 18
                  versionName '1.0.17'
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv('USV_STORE_FILE'))
                      storePassword System.getenv('USV_STORE_PASSWORD')
                      keyAlias System.getenv('USV_KEY_ALIAS')
                      keyPassword System.getenv('USV_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF

      - name: Build signed release AAB
        shell: bash
        env:
          USV_STORE_FILE: ${{ github.workspace }}/usv-troc-upload.jks
          USV_STORE_PASSWORD: ${{ secrets.USV_STORE_PASSWORD }}
          USV_KEY_ALIAS: ${{ secrets.USV_KEY_ALIAS }}
          USV_KEY_PASSWORD: ${{ secrets.USV_KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean bundleRelease --stacktrace

      - name: Verify AAB
        shell: bash
        env:
          USV_STORE_PASSWORD: ${{ secrets.USV_STORE_PASSWORD }}
          USV_KEY_ALIAS: ${{ secrets.USV_KEY_ALIAS }}
        run: |
          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          ls -lh "$AAB"
          jarsigner -verify -verbose -certs "$AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: USV-Troc-v1.0.17-code18
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish AAB in repository
        shell: bash
        run: |
          mkdir -p releases
          cp "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" "releases/USV-Troc-v1.0.17-code18.aab"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/USV-Troc-v1.0.17-code18.aab
          git commit -m "Publish USV Troc 1.0.17 code 18 AAB" || exit 0
          git push
