name: Build USV Troc Android AAB

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'USV-Troc-1.0.17-source-corrected.zip'
      - '.github/workflows/build-aab.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract corrected web project
        shell: bash
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q USV-Troc-1.0.17-source-corrected.zip -d android-project
          PROJECT_DIR="$(find android-project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project dir: $PROJECT_DIR"

      - name: Restore upload keystore
        shell: bash
        env:
          USV_KEYSTORE_B64: ${{ secrets.USV_KEYSTORE_B64 }}
          USV_STORE_PASSWORD: ${{ secrets.USV_STORE_PASSWORD }}
          USV_KEY_ALIAS: ${{ secrets.USV_KEY_ALIAS }}
        run: |
          test -n "$USV_KEYSTORE_B64"
          printf '%s' "$USV_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > "$GITHUB_WORKSPACE/usv-troc-upload.jks"
          test -s "$GITHUB_WORKSPACE/usv-troc-upload.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/usv-troc-upload.jks" -storepass "$USV_STORE_PASSWORD" -alias "$USV_KEY_ALIAS"

      - name: Rebuild native architecture from production 1.0.10
        shell: bash
        run: |
          cat > "$PROJECT_DIR/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
          }
          EOF

          cat > "$PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > "$PROJECT_DIR/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.usv.matchanalyzer'
              compileSdk 36

              defaultConfig {
                  applicationId 'fr.usv.troc'
                  minSdk 26
                  targetSdk 36
                  versionCode 19
                  versionName '1.0.18'
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv('USV_STORE_FILE'))
                      storePassword System.getenv('USV_STORE_PASSWORD')
                      keyAlias System.getenv('USV_KEY_ALIAS')
                      keyPassword System.getenv('USV_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }
          }

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
              implementation 'androidx.profileinstaller:profileinstaller:1.3.0'
          }
          EOF

          mkdir -p "$PROJECT_DIR/app/src/main/java/com/usv/matchanalyzer"
          rm -rf "$PROJECT_DIR/app/src/main/java/fr"

          cat > "$PROJECT_DIR/app/src/main/java/com/usv/matchanalyzer/MainActivity.java" <<'EOF'
          package com.usv.matchanalyzer;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webview);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          Intent intent = params.createIntent();
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html?android=1");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER_REQUEST || filePathCallback == null) return;
                  Uri[] results = null;
                  if (resultCode == RESULT_OK && data != null) {
                      if (data.getClipData() != null) {
                          int count = data.getClipData().getItemCount();
                          results = new Uri[count];
                          for (int i = 0; i < count; i++) results[i] = data.getClipData().getItemAt(i).getUri();
                      } else if (data.getData() != null) {
                          results = new Uri[]{data.getData()};
                      }
                  }
                  filePathCallback.onReceiveValue(results);
                  filePathCallback = null;
              }

              @Override
              public void onBackPressed() {
                  webView.evaluateJavascript(
                      "(function(){var m=document.querySelector('#detailModal:not(.hidden),#rulesModal:not(.hidden),#privacyModal:not(.hidden)');"+
                      "if(m){var b=m.querySelector('.sheet-close,[data-close-modal],[data-close-rules],[data-close-privacy]');if(b){b.click();return 'closed';}}return 'none';})()",
                      value -> {
                          if ("\"closed\"".equals(value)) return;
                          if (webView.canGoBack()) webView.goBack(); else MainActivity.super.onBackPressed();
                      }
                  );
              }
          }
          EOF

          mkdir -p "$PROJECT_DIR/app/src/main/res/xml" "$PROJECT_DIR/app/src/main/res/values"

          cat > "$PROJECT_DIR/app/src/main/res/xml/file_paths.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
              <external-cache-path name="external_cache" path="." />
              <external-files-path name="external_files" path="." />
          </paths>
          EOF

          cat > "$PROJECT_DIR/app/src/main/res/values/strings.xml" <<'EOF'
          <resources><string name="app_name">USV Troc</string></resources>
          EOF

          cat > "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/app_icon"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.USVTroc"
                  android:usesCleartextTraffic="false">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name="com.usv.matchanalyzer.MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build signed release AAB
        shell: bash
        env:
          USV_STORE_FILE: ${{ github.workspace }}/usv-troc-upload.jks
          USV_STORE_PASSWORD: ${{ secrets.USV_STORE_PASSWORD }}
          USV_KEY_ALIAS: ${{ secrets.USV_KEY_ALIAS }}
          USV_KEY_PASSWORD: ${{ secrets.USV_KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean bundleRelease --stacktrace

      - name: Inspect and verify AAB
        shell: bash
        run: |
          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          ls -lh "$AAB"
          unzip -l "$AAB" | grep -E 'base/dex/classes.dex|base/assets/index.html|AndroidManifest.xml'
          jarsigner -verify -verbose -certs "$AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: USV-Troc-v1.0.18-code19-API36-from-1.0.10
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish AAB in repository
        shell: bash
        run: |
          mkdir -p releases
          cp "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab" "releases/USV-Troc-v1.0.18-code19-API36.aab"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/USV-Troc-v1.0.18-code19-API36.aab
          git commit -m "Publish USV Troc 1.0.18 code 19 API36 from 1.0.10 base" || exit 0
          git push
