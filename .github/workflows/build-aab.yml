name: Build USV Troc Android AAB

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    paths:
      - 'USV-Troc-1.0.17-source-corrected.zip'
      - '.github/workflows/build-aab.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract corrected web project
        shell: bash
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q USV-Troc-1.0.17-source-corrected.zip -d android-project
          PROJECT_DIR="$(find android-project -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project dir: $PROJECT_DIR"

      - name: Patch close button and auth email flow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/assets/index.html"
          s = p.read_text(encoding="utf-8")

          # 1) Make product-sheet close button independent from delegated listeners.
          s = s.replace(
              '<button class="sheet-close" data-close-modal type="button">×</button>',
              '<button class="sheet-close" data-close-modal type="button" onclick="closeDetail();return false;" ontouchstart="closeDetail();return false;" aria-label="Fermer">×</button>'
          )

          # Add a capture-phase fallback for touch/pointer events in Android WebView.
          needle = "$('[data-close-modal]').forEach(x=>x.addEventListener('click',closeDetail));"
          replacement = needle + "\n document.addEventListener('pointerdown',e=>{const close=e.target.closest?.('[data-close-modal]');if(close){e.preventDefault();e.stopPropagation();closeDetail();}},true);\n document.addEventListener('touchstart',e=>{const close=e.target.closest?.('[data-close-modal]');if(close){e.preventDefault();e.stopPropagation();closeDetail();}},{capture:true,passive:false});"
          if needle in s and "pointerdown',e=>" not in s:
              s = s.replace(needle, replacement, 1)

          # 2) Use the dedicated USV-troc GitHub Pages URL for auth redirects.
          s = s.replace(
              "redirectTo:'https://cedxv38-svg.github.io/USV-Match-Analyzer/pwa/'",
              "redirectTo:'https://cedxv38-svg.github.io/USV-troc/'"
          )

          # Add emailRedirectTo to sign-up.
          old = "const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name,category,cgu_version:CGU_VERSION,cgu_accepted_at:acceptedAt,privacy_version:PRIVACY_VERSION,privacy_seen_at:privacySeenAt}}});"
          new = "const {data,error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:'https://cedxv38-svg.github.io/USV-troc/',data:{full_name,category,cgu_version:CGU_VERSION,cgu_accepted_at:acceptedAt,privacy_version:PRIVACY_VERSION,privacy_seen_at:privacySeenAt}}});"
          s = s.replace(old,new)

          # Add resend confirmation button to auth screen if absent.
          auth_btn = '<button id="forgotPasswordBtn" class="btn soft wide" type="button" style="margin-top:8px">Mot de passe oublié ?</button>'
          resend_btn = auth_btn + '\n      <button id="resendConfirmBtn" class="btn soft wide hidden" type="button" style="margin-top:8px">Renvoyer l\'e-mail de confirmation</button>'
          if 'id="resendConfirmBtn"' not in s:
              s = s.replace(auth_btn, resend_btn)

          # Bind resend button.
          bind = "$('#forgotPasswordBtn').addEventListener('click',forgotPassword);"
          bind_new = bind + "\n $('#resendConfirmBtn')?.addEventListener('click',resendConfirmation);"
          if "resendConfirmation" not in s:
              s = s.replace(bind, bind_new, 1)

          # Show resend button after register, hide in login mode.
          mode_line = "$('#forgotPasswordBtn').classList.toggle('hidden',register);"
          if mode_line not in s:
              target = "$('#rememberLine')?.classList.toggle('hidden',register);"
              s = s.replace(target, target + "\n $('#forgotPasswordBtn')?.classList.toggle('hidden',register);\n $('#resendConfirmBtn')?.classList.toggle('hidden',!register);")

          # Function to resend signup confirmation.
          fn_marker = "async function forgotPassword(){"
          if "async function resendConfirmation()" not in s:
              resend_fn = "async function resendConfirmation(){\\n const email=$('#authEmail').value.trim();\\n if(!email || !/^\\\\S+@\\\\S+\\\\.\\\\S+$/.test(email)) return alertBox($('#authAlert'),'Saisissez votre adresse e-mail.','err');\\n const btn=$('#resendConfirmBtn'); setBusy(btn,true,'Envoi…');\\n try{\\n   const {error}=await sb.auth.resend({type:'signup',email,options:{emailRedirectTo:'https://cedxv38-svg.github.io/USV-troc/'}});\\n   if(error) throw error;\\n   alertBox($('#authAlert'),'E-mail de confirmation renvoyé. Vérifiez aussi les spams.','ok');\\n }catch(e){\\n   alertBox($('#authAlert'),e.message||'Impossible de renvoyer l’e-mail de confirmation.','err');\\n }finally{ setBusy(btn,false); }\\n}\\n\\n"
              s = s.replace(fn_marker, resend_fn + fn_marker, 1)

          # After signup, make resend visible.
          success = "alertBox($('#authAlert'),'Compte créé. Vérifiez votre e-mail si une confirmation est demandée.','ok');"
          success_new = "alertBox($('#authAlert'),'Compte créé. Un e-mail de confirmation a été demandé. Vérifiez votre boîte de réception et les spams.','ok'); $('#resendConfirmBtn')?.classList.remove('hidden');"
          s = s.replace(success, success_new)

          # Fix UI binding typo that can abort bindUI() in Android WebView.
          s = s.replace("$('[data-close-privacy]').forEach", "$('[data-close-privacy]').forEach")

          # Direct fallback binding for the login/register submit button.
          s = s.replace(
              '<button id="authSubmit" class="btn primary wide" type="button">Se connecter</button>',
              '<button id="authSubmit" class="btn primary wide" type="button" onclick="authSubmit();return false;">Se connecter</button>'
          )

          # Make server-unavailable state explicit instead of silently doing nothing.
          s = s.replace(
              "if(!onlineReady) return alertBox($('#authAlert'),'La version réelle doit être reliée au serveur USV avant la première connexion.','info');",
              "if(!onlineReady) return alertBox($('#authAlert'),'Connexion au serveur USV indisponible. Fermez puis rouvrez l’application et réessayez.','err');"
          )

          # Make auth controls work even if bindUI/DOMContentLoaded is missed in Android WebView.
          s = s.replace(
              '<button id="tabLogin" class="active" type="button">Connexion</button>',
              '<button id="tabLogin" class="active" type="button" onclick="window.USVTrocUI&&window.USVTrocUI.setAuthMode(false);return false;">Connexion</button>'
          )
          s = s.replace(
              '<button id="tabRegister" type="button">Créer un compte</button>',
              '<button id="tabRegister" type="button" onclick="window.USVTrocUI&&window.USVTrocUI.setAuthMode(true);return false;">Créer un compte</button>'
          )
          s = s.replace(
              '<button id="authSubmit" class="btn primary wide" type="button" onclick="authSubmit();return false;">Se connecter</button>',
              '<button id="authSubmit" class="btn primary wide" type="button" onclick="window.USVTrocUI&&window.USVTrocUI.authSubmit();return false;">Se connecter</button>'
          )
          s = s.replace(
              '<button id="authSubmit" class="btn primary wide" type="button">Se connecter</button>',
              '<button id="authSubmit" class="btn primary wide" type="button" onclick="window.USVTrocUI&&window.USVTrocUI.authSubmit();return false;">Se connecter</button>'
          )
          s = s.replace(
              '<button id="forgotPasswordBtn" class="btn soft wide" type="button" style="margin-top:8px">Mot de passe oublié ?</button>',
              '<button id="forgotPasswordBtn" class="btn soft wide" type="button" style="margin-top:8px" onclick="window.USVTrocUI&&window.USVTrocUI.forgotPassword();return false;">Mot de passe oublié ?</button>'
          )

          # Force touchability/z-index of auth controls on Android WebView.
          s = s.replace(
              '.checkline input{margin-top:2px}',
              '.checkline input{margin-top:2px}.auth-card button,.auth-card input,.auth-card select,.auth-card label{position:relative;z-index:5;pointer-events:auto!important;touch-action:manipulation}.auth-card{position:relative;z-index:2}'
          )

          # Expose auth functions globally and make boot robust.
          s = s.replace(
              "window.addEventListener('DOMContentLoaded',boot);",
              "window.USVTrocUI={authSubmit,setAuthMode,forgotPassword};\nlet __usvBootDone=false;async function __startUSV(){if(__usvBootDone)return;__usvBootDone=true;try{await boot();}catch(e){console.error('USV boot error',e);const a=document.getElementById('authAlert');if(a)a.innerHTML='<div class=\\\"alert err\\\">Erreur de démarrage de l’application. Fermez puis rouvrez l’application.</div>';}}\nif(document.readyState==='loading')document.addEventListener('DOMContentLoaded',__startUSV,{once:true});else setTimeout(__startUSV,0);setTimeout(__startUSV,500);"
          )

          # Add visible version for field testing.
          s = s.replace(
              '<p class="microcopy">L\'accès définitif est réservé aux membres et familles de l\'USV.</p>',
              '<p class="microcopy">L\'accès définitif est réservé aux membres et familles de l\'USV.<br><small>Version 1.0.22</small></p>'
          )

          # GLOBAL Android WebView interaction hardening for all app controls.
          global_css = "<style id=\"android-touch-fix\">button,a,[role=\"button\"],input,select,textarea,label,.btn,.tab,.sheet-close,[data-close-modal],[data-close-rules],[data-close-privacy],[data-action]{pointer-events:auto!important;touch-action:manipulation!important;-webkit-tap-highlight-color:rgba(0,0,0,0)!important}button,a,[role=\"button\"],.btn,.tab,.sheet-close{position:relative!important;z-index:50!important}.modal,.sheet,.auth-card,.panel,.card{pointer-events:auto!important}.hidden{pointer-events:none!important}</style>"
          if 'id="android-touch-fix"' not in s:
              s = s.replace('</head>', global_css + '\n</head>', 1)

          # Generic capture fallback: turn touch/pointer events into click for interactive elements
          # when Android WebView swallows the native click event.
          fallback_js = "<script id=\"android-touch-fallback\">(function(){const SEL='button,a,[role=\\\"button\\\"],.btn,.tab,.sheet-close,[data-close-modal],[data-close-rules],[data-close-privacy],[data-action]';let lastTarget=null,lastTime=0;function fire(el,e){if(!el||el.disabled)return;const now=Date.now();if(lastTarget===el&&now-lastTime<350)return;lastTarget=el;lastTime=now;try{if(e){e.preventDefault();e.stopPropagation();}if(typeof el.onclick==='function'){el.onclick.call(el,e||new Event('click'));return;}el.dispatchEvent(new MouseEvent('click',{bubbles:true,cancelable:true,view:window}));}catch(err){console.error('android touch fallback',err);}}document.addEventListener('pointerup',function(e){const el=e.target.closest&&e.target.closest(SEL);if(el)fire(el,e);},true);document.addEventListener('touchend',function(e){const t=e.changedTouches&&e.changedTouches[0];const el=document.elementFromPoint(t?t.clientX:0,t?t.clientY:0);const hit=el&&el.closest&&el.closest(SEL);if(hit)fire(hit,e);},{capture:true,passive:false});})();</script>"
          if 'id="android-touch-fallback"' not in s:
              s = s.replace('</body>', fallback_js + '\n</body>', 1)

          # Ensure common primary actions have direct inline fallbacks.
          replacements = {
            'id="authSubmit"': 'id="authSubmit" onclick="window.USVTrocUI&&window.USVTrocUI.authSubmit();return false;"',
            'id="tabLogin"': 'id="tabLogin" onclick="window.USVTrocUI&&window.USVTrocUI.setAuthMode(false);return false;"',
            'id="tabRegister"': 'id="tabRegister" onclick="window.USVTrocUI&&window.USVTrocUI.setAuthMode(true);return false;"',
            'id="forgotPasswordBtn"': 'id="forgotPasswordBtn" onclick="window.USVTrocUI&&window.USVTrocUI.forgotPassword();return false;"',
          }
          for old,new in replacements.items():
              if old in s and new not in s:
                  s=s.replace(old,new,1)

          # Make detail close button self-contained.
          s=s.replace(
            '<button class="sheet-close" data-close-modal type="button">×</button>',
            '<button class="sheet-close" data-close-modal type="button" onclick="if(typeof closeDetail===\'function\')closeDetail();else this.closest(\'.sheet,.modal\')?.classList.add(\'hidden\');return false;" aria-label="Fermer">×</button>'
          )

          # Visible build marker.
          s=s.replace('Version 1.0.22','Version 1.0.23')

          # Fix all known NodeList selector typos that abort UI binding.
          s = s.replace("$('[data-close-privacy]').forEach", "$('[data-close-privacy]').forEach")
          s = s.replace("$('[data-reply-message]').forEach", "$('[data-reply-message]').forEach")

          # Field-test marker.
          s = s.replace('Version 1.0.23','Version 1.0.24')

          p.write_text(s, encoding="utf-8")
          print("Patched:", p)
          PY

      - name: Bundle Supabase client locally for Android WebView
        shell: bash
        run: |
          ASSET_DIR="$PROJECT_DIR/app/src/main/assets"
          curl -fL --retry 3 --retry-delay 2 \
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" \
            -o "$ASSET_DIR/supabase.js"
          test -s "$ASSET_DIR/supabase.js"
          python3 - <<'PY'
          from pathlib import Path
          import os
          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/assets/index.html"
          s = p.read_text(encoding="utf-8")
          s = s.replace(
              '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>',
              '<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="this.onerror=null;this.src=\'./supabase.js\'"></script>'
          )
          p.write_text(s, encoding="utf-8")
          print("Supabase JS bundled locally:", p)
          PY

      - name: Validate web UI before Android build
        shell: bash
        run: |
          HTML="$PROJECT_DIR/app/src/main/assets/index.html"
          test -s "$HTML"

          # Known fatal UI-binding mistakes must be gone.
          ! grep -Fq "$('[data-close-privacy]').forEach" "$HTML"
          ! grep -Fq "$('[data-reply-message]').forEach" "$HTML"

          # Critical auth controls must have direct Android fallbacks.
          grep -Fq 'id="authSubmit"' "$HTML"
          grep -Fq 'window.USVTrocUI' "$HTML"
          grep -Fq 'id="tabRegister"' "$HTML"
          grep -Fq 'id="forgotPasswordBtn"' "$HTML"

          # Check every inline JavaScript block for syntax errors with Node.
          python3 - <<'PY'
          import os,re,pathlib
          p=pathlib.Path(os.environ["PROJECT_DIR"])/"app/src/main/assets/index.html"
          s=p.read_text(encoding="utf-8")
          blocks=[]
          for m in re.finditer(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',s,re.I|re.S):
              blocks.append(m.group(1))
          out=pathlib.Path("/tmp/usv_js")
          out.mkdir(exist_ok=True)
          for i,b in enumerate(blocks):
              (out/f"block_{i}.js").write_text(b,encoding="utf-8")
          print("inline blocks:",len(blocks))
          PY
          for f in /tmp/usv_js/*.js; do node --check "$f"; done

          echo "UI validation OK"

      - name: Restore upload keystore
        shell: bash
        env:
          USV_KEYSTORE_B64: ${{ secrets.USV_KEYSTORE_B64 }}
          USV_STORE_PASSWORD: ${{ secrets.USV_STORE_PASSWORD }}
          USV_KEY_ALIAS: ${{ secrets.USV_KEY_ALIAS }}
        run: |
          test -n "$USV_KEYSTORE_B64"
          printf '%s' "$USV_KEYSTORE_B64" | tr -cd 'A-Za-z0-9+/=' | base64 --decode > "$GITHUB_WORKSPACE/usv-troc-upload.jks"
          test -s "$GITHUB_WORKSPACE/usv-troc-upload.jks"
          keytool -list -keystore "$GITHUB_WORKSPACE/usv-troc-upload.jks" -storepass "$USV_STORE_PASSWORD" -alias "$USV_KEY_ALIAS"

      - name: Rebuild native architecture from production 1.0.10
        shell: bash
        run: |
          cat > "$PROJECT_DIR/build.gradle" <<'EOF'
          plugins {
              id 'com.android.application' version '8.9.1' apply false
          }
          EOF

          cat > "$PROJECT_DIR/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat > "$PROJECT_DIR/app/build.gradle" <<'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace 'com.usv.matchanalyzer'
              compileSdk 36

              defaultConfig {
                  applicationId 'fr.usv.troc'
                  minSdk 26
                  targetSdk 36
                  versionCode 25
                  versionName '1.0.24'
              }

              signingConfigs {
                  release {
                      storeFile file(System.getenv('USV_STORE_FILE'))
                      storePassword System.getenv('USV_STORE_PASSWORD')
                      keyAlias System.getenv('USV_KEY_ALIAS')
                      keyPassword System.getenv('USV_KEY_PASSWORD')
                  }
              }

              buildTypes {
                  release {
                      minifyEnabled false
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }
          }

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }

          dependencies {
              implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
              implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
              implementation 'androidx.core:core-ktx:1.13.1'
              implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.6.2'
              implementation 'androidx.profileinstaller:profileinstaller:1.3.0'
          }
          EOF

          mkdir -p "$PROJECT_DIR/app/src/main/java/com/usv/matchanalyzer"
          rm -rf "$PROJECT_DIR/app/src/main/java/fr"

          cat > "$PROJECT_DIR/app/src/main/java/com/usv/matchanalyzer/MainActivity.java" <<'EOF'
          package com.usv.matchanalyzer;

          import android.app.Activity;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import android.webkit.ValueCallback;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_main);
                  webView = findViewById(R.id.webview);

                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  s.setAllowFileAccess(true);
                  s.setAllowContentAccess(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public boolean onShowFileChooser(WebView view, ValueCallback<Uri[]> callback, FileChooserParams params) {
                          if (filePathCallback != null) filePathCallback.onReceiveValue(null);
                          filePathCallback = callback;
                          Intent intent = params.createIntent();
                          intent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE, true);
                          try {
                              startActivityForResult(intent, FILE_CHOOSER_REQUEST);
                          } catch (Exception e) {
                              filePathCallback = null;
                              return false;
                          }
                          return true;
                      }
                  });

                  webView.loadUrl("file:///android_asset/index.html?android=1");
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != FILE_CHOOSER_REQUEST || filePathCallback == null) return;
                  Uri[] results = null;
                  if (resultCode == RESULT_OK && data != null) {
                      if (data.getClipData() != null) {
                          int count = data.getClipData().getItemCount();
                          results = new Uri[count];
                          for (int i = 0; i < count; i++) results[i] = data.getClipData().getItemAt(i).getUri();
                      } else if (data.getData() != null) {
                          results = new Uri[]{data.getData()};
                      }
                  }
                  filePathCallback.onReceiveValue(results);
                  filePathCallback = null;
              }

              @Override
              public void onBackPressed() {
                  webView.evaluateJavascript(
                      "(function(){var m=document.querySelector('#detailModal:not(.hidden),#rulesModal:not(.hidden),#privacyModal:not(.hidden)');"+
                      "if(m){var b=m.querySelector('.sheet-close,[data-close-modal],[data-close-rules],[data-close-privacy]');if(b){b.click();return 'closed';}}return 'none';})()",
                      value -> {
                          if ("\"closed\"".equals(value)) return;
                          if (webView.canGoBack()) webView.goBack(); else MainActivity.super.onBackPressed();
                      }
                  );
              }
          }
          EOF

          mkdir -p "$PROJECT_DIR/app/src/main/res/xml" "$PROJECT_DIR/app/src/main/res/values"

          cat > "$PROJECT_DIR/app/src/main/res/xml/file_paths.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
              <external-cache-path name="external_cache" path="." />
              <external-files-path name="external_files" path="." />
          </paths>
          EOF

          cat > "$PROJECT_DIR/app/src/main/res/values/strings.xml" <<'EOF'
          <resources><string name="app_name">USV Troc</string></resources>
          EOF

          cat > "$PROJECT_DIR/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/app_icon"
                  android:label="@string/app_name"
                  android:theme="@style/Theme.USVTroc"
                  android:usesCleartextTraffic="false">

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="${applicationId}.fileprovider"
                      android:exported="false"
                      android:grantUriPermissions="true">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/file_paths" />
                  </provider>

                  <activity
                      android:name="com.usv.matchanalyzer.MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Build signed release AAB
        shell: bash
        env:
          USV_STORE_FILE: ${{ github.workspace }}/usv-troc-upload.jks
          USV_STORE_PASSWORD: ${{ secrets.USV_STORE_PASSWORD }}
          USV_KEY_ALIAS: ${{ secrets.USV_KEY_ALIAS }}
          USV_KEY_PASSWORD: ${{ secrets.USV_KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean bundleRelease --stacktrace

      - name: Inspect and verify AAB
        shell: bash
        run: |
          AAB="$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          ls -lh "$AAB"
          unzip -l "$AAB" | grep -E 'base/dex/classes.dex|base/assets/index.html|AndroidManifest.xml'
          jarsigner -verify -verbose -certs "$AAB"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: USV-Troc-v1.0.24-code25-API36-from-1.0.10
