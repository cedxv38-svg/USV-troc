name: Build USV Troc Android AAB

on:
  workflow_dispatch:
  push:
    paths:
      - 'USV-Troc-1.0.17-source-corrected.zip'
      - '.github/workflows/build-aab.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract project
        run: |
          rm -rf android-project
          mkdir android-project
          unzip -q USV-Troc-1.0.17-source-corrected.zip -d android-project
          echo "PROJECT_DIR=$(find android-project -mindepth 1 -maxdepth 1 -type d | head -n 1)" >> "$GITHUB_ENV"

      - name: Restore upload keystore
        env:
          USV_KEYSTORE_B64: ${{ secrets.USV_KEYSTORE_B64 }}
        run: |
          echo "$USV_KEYSTORE_B64" | base64 --decode > "$GITHUB_WORKSPACE/usv-troc-upload.jks"

      - name: Build signed release AAB
        env:
          USV_STORE_PASSWORD: ${{ secrets.USV_STORE_PASSWORD }}
          USV_KEY_ALIAS: ${{ secrets.USV_KEY_ALIAS }}
          USV_KEY_PASSWORD: ${{ secrets.USV_KEY_PASSWORD }}
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon clean bundleRelease \
            -PUSV_STORE_FILE="$GITHUB_WORKSPACE/usv-troc-upload.jks" \
            -PUSV_STORE_PASSWORD="$USV_STORE_PASSWORD" \
            -PUSV_KEY_ALIAS="$USV_KEY_ALIAS" \
            -PUSV_KEY_PASSWORD="$USV_KEY_PASSWORD"

      - name: Verify AAB exists
        run: |
          test -f "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"
          ls -lh "$PROJECT_DIR/app/build/outputs/bundle/release/app-release.aab"

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: USV-Troc-v1.0.17-code18
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
